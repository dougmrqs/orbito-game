<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marble Orbit</title>
    <meta
      name="description"
      content="A two-player marble game: place your marbles, press the sun, and line up four as the board turns."
    />
    <meta name="theme-color" content="#050814" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>

  <body>
    <main id="stage" aria-label="Game board"></main>

    <header class="hud">
      <p id="turn" class="turn">
        <span class="dot"></span><span id="turn-text"></span>
      </p>
      <p id="hint"></p>
      <p id="message" role="status" aria-live="polite"></p>
    </header>

    <p id="flash" class="flash" aria-hidden="true"></p>

    <footer class="bar">
      <span id="reserves"></span>
      <button id="new-game" type="button">New game</button>
    </footer>

    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
